<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1e293b;
            color: white;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #3b82f6;
            border-radius: 5px;
            background: #334155;
            color: white;
        }
        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #10b981;
        }
        .error {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <h1>EmailJS Test Form</h1>
    <p>This is a simple test to verify your EmailJS configuration.</p>
    
    <form id="testForm">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" value="Test User" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" value="test@example.com" required>
        </div>
        <div class="form-group">
            <label>Subject:</label>
            <input type="text" name="subject" value="Test Email" required>
        </div>
        <div class="form-group">
            <label>Message:</label>
            <textarea name="message" rows="4" required>This is a test message from the portfolio contact form.</textarea>
        </div>
        <button type="submit">Send Test Email</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        // Initialize EmailJS
        emailjs.init('a6l1Ph8gIdj4gEAz0');
        
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Sending email...</p>';
            
            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                subject: formData.get('subject'),
                message: formData.get('message')
            };
            
            try {
                console.log('Testing EmailJS with data:', data);
                
                const response = await emailjs.send(
                    'service_88g26s5',
                    'template_2bti6tg',
                    {
                        from_name: data.name,
                        from_email: data.email,
                        subject: data.subject,
                        message: data.message,
                        to_email: 'divyratan2703@gmail.com'
                    },
                    'a6l1Ph8gIdj4gEAz0'
                );
                
                console.log('Email sent successfully:', response);
                resultDiv.innerHTML = '<div class="result success">✅ Email sent successfully! Check your inbox (and spam folder).</div>';
                
            } catch (error) {
                console.error('EmailJS Error:', error);
                
                let errorMessage = '❌ Failed to send email. ';
                if (error.text) {
                    errorMessage += `Error: ${error.text}`;
                } else if (error.message) {
                    errorMessage += `Error: ${error.message}`;
                } else {
                    errorMessage += 'Unknown error occurred.';
                }
                
                resultDiv.innerHTML = `<div class="result error">${errorMessage}</div>`;
                
                // Show detailed error info
                console.log('Full error object:', error);
                console.log('Error status:', error.status);
                console.log('Error text:', error.text);
            }
        });
    </script>
</body>
</html>
